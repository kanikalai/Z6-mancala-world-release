name: Cleanup Release Folder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Target branch to clean and commit back to"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  cleanup-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0

      - name: Prune invalid and older release folders
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_DIR="release"

          if [ ! -d "$RELEASE_DIR" ]; then
            echo "Directory '$RELEASE_DIR' does not exist. Nothing to clean."
            exit 0
          fi

          python3 - "$RELEASE_DIR" <<'EOF'
          import os
          import re
          import shutil
          import sys

          release_dir = sys.argv[1]
          pattern = re.compile(r"^([0-9]+)\.([0-9]+)\.([0-9]+)(-dev)?\+([0-9]+)$")

          valid_entries = []
          invalid_entries = []

          for entry in sorted(os.listdir(release_dir)):
              full_path = os.path.join(release_dir, entry)

              # Remove non-directories or directories not matching the required format
              if not os.path.isdir(full_path):
                  invalid_entries.append((entry, full_path))
                  continue

              match = pattern.match(entry)
              if not match:
                  invalid_entries.append((entry, full_path))
                  continue

              major = int(match.group(1))
              minor = int(match.group(2))
              build = int(match.group(3))
              is_prod = 0 if match.group(4) == "-dev" else 1
              revision = int(match.group(5))

              rank = (major, minor, build, revision, is_prod)
              valid_entries.append((rank, entry, full_path))

          # Delete folders/files that do not match the naming format
          for name, path in invalid_entries:
              print(f"Deleting invalid entry: {name}")
              if os.path.isdir(path) and not os.path.islink(path):
                  shutil.rmtree(path)
              else:
                  os.remove(path)

          if not valid_entries:
              print("No valid release folders found.")
              sys.exit(0)

          # Pick the single highest-ranked folder
          valid_entries.sort(key=lambda item: item[0])
          latest_rank, latest_name, latest_path = valid_entries[-1]
          print(f"Keeping latest release folder: {latest_name} (rank={latest_rank})")

          # Delete all older valid release folders
          for rank, name, path in valid_entries[:-1]:
              print(f"Deleting older release folder: {name} (rank={rank})")
              if os.path.isdir(path) and not os.path.islink(path):
                  shutil.rmtree(path)
              else:
                  os.remove(path)
          EOF

      - name: Commit and push changes
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "chore(release): keep only latest valid release folder"
          git push origin HEAD:"${{ inputs.branch || github.ref_name }}"




